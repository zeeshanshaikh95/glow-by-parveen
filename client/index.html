<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / app icons derived from the client's official logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffcfed" />

    <title>Glow by Parveen — Natural & Herbal Beauty</title>
    <meta
      name="description"
      content="Glow by Parveen — handcrafted natural and herbal beauty products. Browse the catalogue and order easily on WhatsApp."
    />
    <!--
      Site-wide social card. WhatsApp / Facebook / Twitter scrapers do not run
      JavaScript, so these static tags are what they read for ANY url — values
      must be absolute. Per-page metadata is added by the app (Helmet) for
      JS-capable crawlers such as Google.
      TODO: replace with the client's real domain once purchased.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glow by Parveen" />
    <meta property="og:title" content="Glow by Parveen — Natural & Herbal Beauty" />
    <meta
      property="og:description"
      content="Handcrafted natural and herbal beauty products. Order easily on WhatsApp."
    />
    <meta property="og:url" content="https://zeeshanshaikh95.github.io/glow-by-parveen/" />
    <meta
      property="og:image"
      content="https://zeeshanshaikh95.github.io/glow-by-parveen/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glow by Parveen" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
