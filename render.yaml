# Render blueprint — Glow by Parveen API (free tier)
#
# Deploy: Render dashboard → New + → Blueprint → pick this repo.
# Values marked `sync: false` are entered in the Render dashboard and are
# never committed to git. See docs/DEPLOYMENT.md for the full walkthrough.
services:
  - type: web
    name: glow-by-parveen-api
    runtime: node
    plan: free
    region: singapore            # closest region to the client's audience
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true             # redeploy on every push to main
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Auto-bootstrap admin + site settings on boot (idempotent, no catalogue data).
      - key: AUTO_SEED
        value: true
      # MongoDB Atlas M0 connection string — set in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      # Strong random value generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Public URLs.
      - key: PUBLIC_SITE_URL
        value: https://zeeshanshaikh95.github.io/glow-by-parveen
      - key: PUBLIC_API_URL
        sync: false              # https://glow-by-parveen-api.onrender.com
      # CORS allowlist — Pages frontend + local dev.
      - key: CORS_ORIGINS
        value: https://zeeshanshaikh95.github.io,http://localhost:5173
      # First-admin bootstrap credentials — set in the Render dashboard.
      # Stored as bcrypt hash only; first login forces a password change.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
